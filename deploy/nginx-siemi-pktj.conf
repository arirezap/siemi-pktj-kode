# nginx untuk SIEMI PKTJ — salin ke /etc/nginx/sites-available/siemi-pktj
# (setup-server.sh melakukannya otomatis dan mengganti DOMAIN_ANDA).
# HTTPS ditambahkan oleh certbot setelah DNS mengarah ke server.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA;

    # Batas unggahan: samakan dengan limit JSON di server (15 MB) + berkas bukti 10 MB.
    client_max_body_size 15m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
